name: package

# Builds both mods and uploads them as downloadable artifacts (no release/tag
# needed). Handy for testing a build or grabbing a zip to upload to the VS Mod DB.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 1.22.2, matching ci.yml's analyze job: the declared minimum game version.
      - name: Download Vintage Story server
        uses: ./.github/actions/vs-server
        with:
          version: 1.22.2

      - name: Build
        run: dotnet build Manifold.slnx -c Release

      - name: Package mod zips
        run: |
          set -e
          SHA="${GITHUB_SHA::7}"

          MANI_OUT="src/Manifold/bin/Release/net10.0"
          mkdir -p package/manifold
          cp "$MANI_OUT/Manifold.dll" package/manifold/
          cp src/Manifold/modinfo.json package/manifold/
          cp src/Manifold/modicon.png package/manifold/
          (cd package/manifold && zip -r "$GITHUB_WORKSPACE/Manifold-$SHA.zip" .)

          SAMPLE_OUT="samples/ManifoldSample/bin/Release/net10.0"
          mkdir -p package/sample
          cp "$SAMPLE_OUT/ManifoldSample.dll" package/sample/
          cp samples/ManifoldSample/modinfo.json package/sample/
          cp samples/ManifoldSample/modicon.png package/sample/
          if [ -d "$SAMPLE_OUT/assets" ]; then cp -r "$SAMPLE_OUT/assets" package/sample/; fi
          (cd package/sample && zip -r "$GITHUB_WORKSPACE/ManifoldSample-$SHA.zip" .)

          ls -la ./*.zip

      - name: Upload Manifold artifact
        uses: actions/upload-artifact@v7
        with:
          name: Manifold
          path: Manifold-*.zip

      - name: Upload ManifoldSample artifact
        uses: actions/upload-artifact@v7
        with:
          name: ManifoldSample
          path: ManifoldSample-*.zip
