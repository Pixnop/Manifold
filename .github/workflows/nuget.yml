name: nuget

# Publishes the Manifold API as a NuGet package on a version tag (or manual run).
# The package is a compile-time reference (Manifold.dll); the mod itself ships on the Mod DB.
# Authentication uses NuGet Trusted Publishing (GitHub OIDC): the NuGet/login step exchanges
# this run's OIDC token for a short-lived API key, validated on nuget.org against the policy
# (package owner Pixnop, repository Pixnop/Manifold, workflow nuget.yml). No stored secret,
# nothing to rotate or expire.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 0.6.0). Empty publishes a dev version."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A manual publish of an already released version must pack that release's tagged
      # sources, not whatever the dispatching branch holds today. Checked out beside the
      # workspace so this workflow's own local actions stay available.
      - name: Check out the release tag
        if: inputs.version != ''
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          path: release

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 1.22.2, matching ci.yml's analyze job: only the API DLL is needed to pack.
      - name: Download Vintage Story server (for API DLLs)
        uses: ./.github/actions/vs-server
        with:
          version: 1.22.2

      - name: Pack
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          SRC=.
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ -n "$INPUT_VERSION" ]; then
            SRC=release
          fi
          echo "Packing version $VERSION from $SRC"
          dotnet pack "$SRC/src/Manifold/Manifold.csproj" -c Release -p:Version="$VERSION" -o nupkgs
          ls -la nupkgs

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Pixnop

      - name: Push to NuGet
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
