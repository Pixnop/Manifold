name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze:
    name: Build, test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 17 (required by SonarScanner)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Pinned to 1.22.2: Manifold.Pure.Tests mocks IPlayer with NSubstitute, which cannot
      # proxy an internal member IPlayer gained in 1.22.4 (see README.md's Building from
      # Source section). The e2e job below runs the real engine and isn't affected.
      - name: Download Vintage Story server (for API DLL references)
        uses: ./.github/actions/vs-server
        with:
          version: 1.22.2

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Pixnop_Manifold" \
            /o:"leon-fievet-pixnop" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.coverage.exclusions="samples/**,**/ManifoldModSystem.cs,**/PlayerTeleporter.cs,**/PlayerDismounter.cs,**/PortalBlockBase.cs,**/ManifoldNetworkChannel.cs,**/CoreServerApiExtensions.cs,**/CoreClientApiExtensions.cs,**/ManifoldAccess.cs,**/*Facade.cs,**/DimensionCommandBuilder.cs,**/StreamingWorldgenDriver.cs,**/DimensionGenerator.cs,**/InventorySwapper.cs,**/EntityMover.cs,**/BlockMover.cs,**/EntityPosAccess.cs"

      - name: Build
        run: dotnet build Manifold.slnx -c Release

      - name: Test with coverage
        # coverlet.collector instruments the already-built assemblies when the test run
        # starts (it's a data collector, not a build-time step); reuse the Build step output.
        run: |
          dotnet test tests/Manifold.Pure.Tests \
            -c Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings

      - name: SonarCloud end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  e2e:
    name: E2E scenarios (VS 1.22.7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 1.22.7: the integration suite boots a real engine and isn't limited by the
      # NSubstitute/IPlayer issue pinning the analyze job to 1.22.2 above.
      - name: Download Vintage Story server
        uses: ./.github/actions/vs-server
        with:
          version: 1.22.7

      - name: E2E scenarios
        run: |
          dotnet test tests/Manifold.Scenarios \
            -c Release \
            --logger "trx;LogFileName=scenarios.trx" \
            --results-directory TestResults

      # Cross-version compatibility (0.5.1 release <-> this dev build, both directions), one
      # project per direction (see Manifold.Scenarios.Compat/README.md's "Why two projects
      # instead of one"): a process can only bind ONE physical build of Manifold's
      # frozen-identity dll, so each direction needs its own dotnet test invocation (its own
      # process) rather than being two classes sharing one project. The upgrade direction loads
      # its committed savegame fixture as-is (see below for why); the downgrade direction's is
      # regenerated fresh first.
      - name: E2E compat scenarios (0.5.1 -> dev)
        run: |
          dotnet test tests/Manifold.Scenarios.Compat \
            -c Release \
            --logger "trx;LogFileName=compat-upgrade.trx" \
            --results-directory TestResults

      # downgrade-from-dev.vcdbs (unlike upgrade-from-0.5.1.vcdbs, which is a snapshot of a
      # frozen, published release and can never go stale) is a snapshot of THIS repo's own dev
      # persistence code; see Manifold.Scenarios.CompatFixtures/README.md's "Committing the two
      # output files" for why that specific snapshot is regenerated here instead of trusted from
      # the checkout. Overwrites the committed copy in this runner's own workspace only; the
      # committed file in the repo is untouched and still exists for local convenience.
      - name: Regenerate downgrade-from-dev.vcdbs
        run: |
          dotnet tool install --global Pixnop.Atlas.Cli --version 0.15.0
          dotnet build tests/Manifold.Scenarios.CompatFixtures -c Release
          atlas fixture tests/Manifold.Scenarios.CompatFixtures/bin/Release/net10.0/Manifold.Scenarios.CompatFixtures.dll \
            --scenario BuildTheDowngradeFixture \
            --out tests/Manifold.Scenarios.CompatDowngrade/fixtures/downgrade-from-dev.vcdbs --force

      - name: E2E compat scenarios (dev -> 0.5.1)
        run: |
          dotnet test tests/Manifold.Scenarios.CompatDowngrade \
            -c Release \
            --logger "trx;LogFileName=compat-downgrade.trx" \
            --results-directory TestResults

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios-trx
          path: |
            TestResults/scenarios.trx
            TestResults/compat-upgrade.trx
            TestResults/compat-downgrade.trx
