name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# Opt into the Node.js 24 action runtime ahead of the June 2026 forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip prerelease tags (e.g. v0.1.0-alpha.1): those publish the NuGet package only.
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Vintage Story server
        run: |
          set -e
          curl -sSL -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.21.0.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Manifold.slnx -c Release

      - name: Package mod zips (library + demo companion)
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"

          # Manifold (the library mod) - no in-game assets.
          MANI_OUT="src/Manifold/bin/Release/net10.0"
          mkdir -p package/manifold
          cp "$MANI_OUT/Manifold.dll" package/manifold/
          cp src/Manifold/modinfo.json package/manifold/
          cp src/Manifold/modicon.png package/manifold/
          (cd package/manifold && zip -r "$GITHUB_WORKSPACE/Manifold-$VERSION.zip" .)

          # ManifoldSample (the demo companion). Bundles its own assets but NOT
          # Manifold.dll (it depends on Manifold as a separate mod).
          SAMPLE_OUT="samples/ManifoldSample/bin/Release/net10.0"
          mkdir -p package/sample
          cp "$SAMPLE_OUT/ManifoldSample.dll" package/sample/
          cp samples/ManifoldSample/modinfo.json package/sample/
          cp samples/ManifoldSample/modicon.png package/sample/
          if [ -d "$SAMPLE_OUT/assets" ]; then cp -r "$SAMPLE_OUT/assets" package/sample/; fi
          (cd package/sample && zip -r "$GITHUB_WORKSPACE/ManifoldSample-$VERSION.zip" .)

          ls -la ./*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Manifold-*.zip
            ManifoldSample-*.zip
          generate_release_notes: true
