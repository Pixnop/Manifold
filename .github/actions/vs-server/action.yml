name: Download Vintage Story server
description: >-
  Fetches (or restores from cache) a Vintage Story server tarball and exports
  VINTAGE_STORY to the folder containing VintagestoryAPI.dll.

inputs:
  version:
    description: "Vintage Story server version, e.g. 1.22.2"
    required: true

runs:
  using: composite
  steps:
    - name: Cache Vintage Story server
      id: cache-vs
      uses: actions/cache@v6
      with:
        path: ~/vs
        key: vs-server-linux-x64-${{ inputs.version }}

    - name: Download Vintage Story server
      if: steps.cache-vs.outputs.cache-hit != 'true'
      shell: bash
      env:
        VS_VERSION: ${{ inputs.version }}
      run: |
        set -e
        curl -sSL --proto '=https' --proto-redir '=https' \
          -o vs_server.tar.gz \
          "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
        mkdir -p "$HOME/vs"
        tar -xzf vs_server.tar.gz -C "$HOME/vs"

    - name: Export VINTAGE_STORY
      shell: bash
      run: |
        set -e
        DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
        echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"
        echo "Resolved VINTAGE_STORY=$DLL_DIR"
